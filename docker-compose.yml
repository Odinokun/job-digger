# The local database for development.
# How to start it, a command cheat sheet and the data loss warning: README.md, the database section.
services:
  db:
    image: postgres:18
    container_name: job-digger-db
    restart: unless-stopped

    # The port is open only to this machine, like `next dev -H 127.0.0.1`:
    # without the 127.0.0.1 prefix Docker would open the database to the whole local network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    # These variables apply only on the first initialisation, when there is no volume yet.
    # Changing the password later needs `docker compose down -v`, that is losing the local data.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required, see README.md}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see README.md}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required, see README.md}

    # The default 64 MB of /dev/shm is too little for PostgreSQL - the image documentation advises this size.
    shm_size: 128mb

    volumes:
      # For PostgreSQL 18 the volume is mounted exactly here; up to 17 the path was
      # /var/lib/postgresql/data, so older examples from the internet do not fit here.
      - pgdata:/var/lib/postgresql

    # During initialisation the database does not accept connections yet, so migrations and the app
    # have to wait for healthy, not for "the container is running".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
