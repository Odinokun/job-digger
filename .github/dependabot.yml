# Оновлення actions із .github/workflows: вони закріплені за commit SHA
# (задача 7.09), тож самі по собі вже не оновлюються. Раз на тиждень Dependabot
# відкриває PR, де міняє SHA разом із коментарем-версією.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot
#
# npm-залежності тут свідомо не підключені: їх оновлюємо руками з `npm audit`
# у CI (README, розділ «npm audit»).
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Для actions - саме "/": Dependabot сам дивиться в /.github/workflows.
    directory: "/"
    schedule:
      interval: "weekly"
    # Назва PR береться з коміту, а коміт - Conventional Commits, як усі
    # наші: Dependabot сам додає двокрапку після префікса - «ci: ...».
    commit-message:
      prefix: "ci"
