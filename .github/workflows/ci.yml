# Checks GitHub runs on every pull request and every push to main.
# The same commands run locally - the list is in the README, the scripts section.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned to a full commit SHA, not a tag: a tag can be moved to other
# code, a SHA cannot. Dependabot updates the version comment on the same line
# together with the SHA (.github/dependabot.yml; README, the CI section).
# https://docs.github.com/en/actions/reference/security/secure-use

# The run's token gets read-only access to the code - the actions/checkout recommendation.
permissions:
  contents: read

# A new commit to a branch cancels its previous run: finishing the queue on code
# that is already out of date makes no sense.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Node version comes from .nvmrc, so it is not duplicated here too.
      # cache: npm caches ~/.npm keyed by the package-lock.json hash.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: installs strictly from package-lock.json, without updating versions.
      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      # Only high and critical: moderate in dev dependencies (esbuild in drizzle-kit)
      # is an accepted risk, the reasoning is in the README, the npm audit section.
      - run: npm audit --audit-level=high

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # PostgreSQL next to the job: GitHub starts the container before the steps and
    # stops it after the run. The steps do not start until the health check inside the
    # container answers, so the tests never see a database that is still initialising.
    # https://docs.github.com/en/actions/use-cases-and-examples/using-containerized-services/creating-postgresql-service-containers
    services:
      postgres:
        # The same major as in docker-compose.yml: without a tag CI would one day move
        # to the next version, while local development stayed on 18.
        image: postgres:18
        env:
          # The password is the run number, not a literal string: the container lives
          # only for this run and is reachable only from its machine anyway, and the
          # file has nothing a secret scanner (GitGuardian in our case) should treat as
          # a credential. The github context is allowed in services.<id>.env:
          # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
          POSTGRES_PASSWORD: ${{ github.run_id }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # The container becomes reachable on the run's machine as 127.0.0.1:5432.
          - 5432:5432

    env:
      # src/server/db/testing/global-setup.ts creates the job_digger_test database: it
      # connects to the postgres maintenance database and runs the migrations.
      # DATABASE_URL is not set here - the integration tests do not need it, and the
      # safeguard in env.ts only requires the addresses not to match.
      TEST_DATABASE_URL: postgres://postgres:${{ github.run_id }}@127.0.0.1:5432/job_digger_test
      # A separate E2E database in the same container. e2e/global-setup.ts creates it,
      # and playwright.config.ts passes it to the app as DATABASE_URL.
      E2E_DATABASE_URL: postgres://postgres:${{ github.run_id }}@127.0.0.1:5432/job_digger_e2e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run test:unit
      - run: npm run test:integration

      # Browsers are not cached. The Playwright documentation: "Caching browser binaries
      # is not recommended" - restoring the cache takes about as long as downloading,
      # and the OS dependencies on Linux are not cached anyway.
      # https://playwright.dev/docs/ci
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # The report is needed only when E2E failed: nobody opens it on a green run. The
      # report has the trace of the failed scenario (`trace: "on-first-retry"`).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
